<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答案之书 - 数字化六爻</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-grey: #16161a;
            --accent-gold: #c5a059;
            --bright-gold: #f3d498;
            --gold-glow: rgba(197, 160, 89, 0.2);
            --text-main: #d1d1d6;
            --text-dim: #71717a;
            --yin-color: #27272a;
        }

        body {
            font-family: 'Optima', 'Baskerville', 'PingFang SC', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1c1c21 0%, #0a0a0c 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-grey);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        h1 { text-align: center; font-size: 2.2rem; letter-spacing: 12px; color: var(--accent-gold); margin: 0; font-weight: 300; }
        .subtitle { text-align: center; color: var(--text-dim); font-size: 0.7rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }

        .input-section { display: grid; gap: 20px; margin-bottom: 30px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--accent-gold); margin-bottom: 8px; opacity: 0.7; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #2d2d33; border-radius: 10px; color: var(--bright-gold); font-size: 1.1rem; box-sizing: border-box; text-align: center; }
        input:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 15px var(--gold-glow); }

        button { width: 100%; padding: 18px; background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); border-radius: 10px; font-size: 1rem; letter-spacing: 4px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: var(--accent-gold); color: #000; }

        #result { display: none; margin-top: 40px; border-top: 1px solid #2d2d33; padding-top: 30px; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gua-header { text-align: center; margin-bottom: 30px; }
        .gua-name { font-size: 2rem; color: var(--bright-gold); margin-bottom: 5px; }
        .gua-code { font-size: 0.8rem; color: var(--text-dim); }

        .diagrams { display: flex; justify-content: space-around; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; }
        .yao-row { height: 8px; width: 100px; margin: 10px 0; display: flex; justify-content: space-between; }
        .yang { width: 100%; height: 100%; background: var(--accent-gold); }
        .yin { width: 46%; height: 100%; background: var(--yin-color); }

        .info-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; border-left: 3px solid var(--accent-gold); }
        .card h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--accent-gold); text-transform: uppercase; }
        .card p { margin: 0; font-size: 0.92rem; line-height: 1.6; color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <h1>答案之书</h1>
    <p class="subtitle">Hexagram Oracle Engine</p>

    <div class="input-section">
        <div class="input-group"><label>量子序列 I (天)</label><input type="number" id="num1" placeholder="输入任意数字"></div>
        <div class="input-group"><label>量子序列 II (地)</label><input type="number" id="num2" placeholder="输入任意数字"></div>
        <div class="input-group"><label>量子序列 III (变)</label><input type="number" id="num3" placeholder="输入任意数字"></div>
    </div>

    <button onclick="calculate()">读取天机</button>

    <div id="result">
        <div class="gua-header">
            <div class="gua-name" id="out-name"></div>
            <div class="gua-code" id="out-code"></div>
        </div>
        <div class="diagrams">
            <div id="ben-bars"></div>
            <div id="bian-bars"></div>
        </div>
        <div id="info-content" class="info-grid"></div>
    </div>
</div>

<script>
    const baseGua = [
        { n: "坤", c: [0,0,0], k: "地", s: "柔顺包容" }, { n: "乾", c: [1,1,1], k: "天", s: "刚健进取" },
        { n: "兑", c: [0,1,1], k: "泽", s: "喜悦社交" }, { n: "离", c: [1,0,1], k: "火", s: "文明向上" },
        { n: "震", c: [0,0,1], k: "雷", s: "行动爆发" }, { n: "巽", c: [1,1,0], k: "风", s: "渗透顺应" },
        { n: "坎", c: [0,1,0], k: "水", s: "陷险诚信" }, { n: "艮", c: [1,0,0], k: "山", s: "静止止步" }
    ];

    const names64 = [
        "坤为地","地天泰","地泽临","地火明夷","地雷复","地风升","地水师","地山谦",
        "天地否","乾为天","天泽履","天火同人","天雷无妄","天风姤","天水讼","天山遁",
        "泽地萃","泽天夬","兑为泽","泽火革","泽雷随","泽风大过","泽水困","泽山咸",
        "火地晋","火天大有","火泽睽","离为火","火雷噬嗑","火风鼎","火水未济","火山旅",
        "雷地豫","雷天大壮","雷泽归妹","雷火丰","震为雷","雷风恒","雷水解","雷山小过",
        "风地观","风天小畜","风泽中孚","风火家人","风雷益","巽为风","风水涣","风山渐",
        "水地比","水天需","水泽节","水火既济","水雷屯","水风井","坎为水","水山蹇",
        "山地剥","山天大畜","山泽损","山火贲","山雷颐","山风蛊","山水蒙","艮为山"
    ];

    const meanings = {
        "乾": "主成功、权力与刚强。宜开拓，忌骄傲。", "坤": "主配合、稳固与包容。宜守成，忌盲动。",
        "震": "主变动、惊雷与新生。宜果断，忌惊慌。", "巽": "主进入、微风与商业。宜渗透，忌犹豫。",
        "坎": "主困难、波折与磨练。宜守信，忌冒险。", "离": "主光明、名声与热烈。宜展示，忌急躁。",
        "艮": "主止步、积蓄与沉稳。宜静观，忌强求。", "兑": "主喜悦、口才与交流。宜谈判，忌口舌。"
    };

    function draw(code, id) {
        const target = document.getElementById(id); target.innerHTML = '';
        [...code].reverse().forEach(bit => {
            const row = document.createElement('div'); row.className = 'yao-row';
            row.innerHTML = bit ? '<div class="yang"></div>' : '<div class="yin"></div><div class="yin"></div>';
            target.appendChild(row);
        });
    }

    function calculate() {
        const v = [parseInt(document.getElementById('num1').value), parseInt(document.getElementById('num2').value), parseInt(document.getElementById('num3').value)];
        if(v.some(isNaN)) return alert("请输入完整的观测序列");

        const s = v[0] % 8, x = v[1] % 8, m = (v[2] % 6) || 6;
        const name = names64[s * 8 + x], ben = [...baseGua[x].c, ...baseGua[s].c], bian = [...ben];
        bian[m-1] = bian[m-1] ? 0 : 1;

        document.getElementById('result').style.display = 'block';
        document.getElementById('out-name').innerText = name;
        document.getElementById('out-code').innerText = `${baseGua[s].n}上 ${baseGua[x].n}下 · 第 ${m} 爻动`;
        draw(ben, 'ben-bars'); draw(bian, 'bian-bars');

        const sg = baseGua[s], xg = baseGua[x];
        const content = `
            <div class="card"><h4>核心卦义</h4><p>${sg.k}${xg.k}${name}：${sg.s}与${xg.s}的交织。${meanings[sg.n]}</p></div>
            <div class="card"><h4>事业/学业</h4><p>${(s+x)%2===0 ? '当前处于上升期，阻力虽在但方向正确。' : '目前宜退不宜进，适合修整和复盘。'}建议利用“${sg.k}”的特质处理当下问题。</p></div>
            <div class="card"><h4>情感/人际</h4><p>${x > 3 ? '对方态度明朗，宜真诚沟通。' : '目前存在沟通隔阂，需保持耐心。'}变爻显示局面正从${m > 3 ? '外部' : '内部'}发生微妙转化。</p></div>
            <div class="card" style="background:rgba(197,160,89,0.1)"><h4>答案之训</h4><p>“${name}”告诉我们：${sg.n === xg.n ? '纯粹的力量需要克制。' : '异质的结合产生新机。'}在第${m}次选择时，请务必听从直觉而非逻辑。</p></div>
        `;
        document.getElementById('info-content').innerHTML = content;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
