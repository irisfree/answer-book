<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作鼓励师 - 职场能量观测仪</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-grey: #16161a;
            --accent-gold: #c5a059;
            --bright-gold: #f3d498;
            --gold-glow: rgba(197, 160, 89, 0.2);
            --text-main: #d1d1d6;
            --text-dim: #71717a;
            --yin-color: #27272a;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1c1c21 0%, #0a0a0c 100%);
            color: var(--text-main);
            margin: 0; display: flex; justify-content: center; min-height: 100vh; padding: 40px 20px; box-sizing: border-box;
        }

        .container { max-width: 600px; width: 100%; background: var(--card-grey); border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 24px; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        h1 { text-align: center; font-size: 2.2rem; letter-spacing: 8px; color: var(--accent-gold); margin: 0; font-weight: 300; }
        .subtitle { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase; }
        .input-tip { color: var(--accent-gold); font-size: 0.8rem; text-align: center; margin-bottom: 20px; opacity: 0.8; line-height: 1.6; }
        .input-section { display: grid; gap: 20px; margin-bottom: 30px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #2d2d33; border-radius: 10px; color: var(--bright-gold); font-size: 1.1rem; box-sizing: border-box; text-align: center; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 15px var(--gold-glow); }
        button { width: 100%; padding: 18px; background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); border-radius: 10px; font-size: 1rem; letter-spacing: 4px; cursor: pointer; transition: 0.3s; margin-top: 10px; font-weight: bold; }
        button:hover { background: var(--accent-gold); color: #000; }

        #result { display: none; margin-top: 40px; border-top: 1px solid #2d2d33; padding-top: 30px; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gua-header { text-align: center; margin-bottom: 30px; }
        .gua-name { font-size: 1.8rem; color: var(--bright-gold); margin-bottom: 5px; }
        .gua-code { font-size: 0.8rem; color: var(--text-dim); }

        .diagrams { display: flex; justify-content: space-around; margin-bottom: 30px; background: rgba(0,0,0,0.1); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .yao-row { height: 8px; width: 110px; margin: 12px 0; display: flex; justify-content: space-between; }
        .yang { width: 100%; height: 100%; background: var(--accent-gold); box-shadow: 0 0 8px var(--gold-glow); }
        .yin { width: 46%; height: 100%; background: var(--yin-color); }

        .info-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; border-left: 3px solid var(--accent-gold); }
        .card h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--accent-gold); letter-spacing: 1px; }
        .card p { margin: 0; font-size: 0.95rem; line-height: 1.7; color: var(--text-main); font-weight: 300; }
        .quote-card { background: linear-gradient(135deg, rgba(197,160,89,0.15) 0%, transparent 100%); border-left: 3px solid var(--bright-gold); }
    </style>
</head>
<body>

<div class="container">
    <h1>工作鼓励师</h1>
    <p class="subtitle">Workplace Energy Oracle</p>

    <div class="input-tip">
        ⚡ <b>输入指引</b>：<br>
        1. 此时的小时数 | 2. 此时的分钟数 | 3. 随机幸运数<br>
        (仅支持大于0的正整数)
    </div>

    <div class="input-section">
        <div class="input-group"><label>观测维度 - 天 (Alpha)</label><input type="number" id="num1" min="1" placeholder="正整数"></div>
        <div class="input-group"><label>观测维度 - 地 (Beta)</label><input type="number" id="num2" min="1" placeholder="正整数"></div>
        <div class="input-group"><label>观测维度 - 人 (Gamma)</label><input type="number" id="num3" min="1" placeholder="正整数"></div>
    </div>

    <button onclick="calculate()">读取今日职场能量</button>

    <div id="result">
        <div class="gua-header">
            <div class="gua-name" id="out-name"></div>
            <div class="gua-code" id="out-code"></div>
        </div>
        <div class="diagrams">
            <div id="ben-bars"></div>
            <div id="bian-bars"></div>
        </div>
        <div id="info-content" class="info-grid"></div>
    </div>
</div>

<script>
    const baseGua = [
        { n: "坤", c: [0,0,0], k: "地", msg: "当下适合深耕基础，做那个最靠谱的执行者。稳住，便是赢。" },
        { n: "乾", c: [1,1,1], k: "天", msg: "职场能量爆表！现在的你具备统领全局的潜力，大胆推进你的方案。" },
        { n: "兑", c: [0,1,1], k: "泽", msg: "沟通胜过蛮干。今日适合商务谈判或跨部门协作，你的亲和力是杀手锏。" },
        { n: "离", c: [1,0,1], k: "火", msg: "灵感迸发的时刻。你的才华正在被看见，适合进行创意产出或公开演讲。" },
        { n: "震", c: [0,0,1], k: "雷", msg: "变动即是机遇。不要害怕突如其来的调整，雷厉风行才是你的本色。" },
        { n: "巽", c: [1,1,0], k: "风", msg: "借力打力，顺势而为。像风一样敏锐，在复杂的职场关系中寻找最优解。" },
        { n: "坎", c: [0,1,0], k: "水", msg: "处变不惊。当前可能面临一些小坎坷，保持诚信与冷静，水滴石穿。" },
        { n: "艮", c: [1,0,0], k: "山", msg: "知止而不殆。有些事急不得，停下来复盘和积蓄力量，比盲目冲锋更重要。" }
    ];

    const names64 = [
        "坤为地","地天泰","地泽临","地火明夷","地雷复","地风升","地水师","地山谦",
        "天地否","乾为天","天泽履","天火同人","天雷无妄","天风姤","天水讼","天山遁",
        "泽地萃","泽天夬","兑为泽","泽火革","泽雷随","泽风大过","泽水困","泽山咸",
        "火地晋","火天大有","火泽睽","离为火","火雷噬嗑","火风鼎","火水未济","火山旅",
        "雷地豫","雷天大壮","雷泽归妹","雷火丰","震为雷","雷风恒","雷水解","雷山小过",
        "风地观","风天小畜","风泽中孚","风火家人","风雷益","巽为风","风水涣","风山渐",
        "水地比","水天需","水泽节","水火既济","水雷屯","水风井","坎为水","水山蹇",
        "山地剥","山天大畜","山泽损","山火贲","山雷颐","山风蛊","山水蒙","艮为山"
    ];

    function draw(code, id) {
        const target = document.getElementById(id); target.innerHTML = '';
        [...code].reverse().forEach(bit => {
            const row = document.createElement('div'); row.className = 'yao-row';
            row.innerHTML = bit ? '<div class="yang"></div>' : '<div class="yin"></div><div class="yin"></div>';
            target.appendChild(row);
        });
    }

    function calculate() {
        const v = [parseInt(document.getElementById('num1').value), parseInt(document.getElementById('num2').value), parseInt(document.getElementById('num3').value)];
        if(v.some(isNaN) || v.some(n => n <= 0)) {
            alert("⚠️ 请输入大于零的正整数，让我们更准确地感知能量。"); return;
        }

        const s = v[0] % 8, x = v[1] % 8, m = (v[2] % 6) || 6;
        const name = names64[s * 8 + x], ben = [...baseGua[x].c, ...baseGua[s].c], bian = [...ben];
        bian[m-1] = bian[m-1] ? 0 : 1;

        document.getElementById('result').style.display = 'block';
        document.getElementById('out-name').innerText = `本时段状态：${name}`;
        document.getElementById('out-code').innerText = `${baseGua[s].n}上 ${baseGua[x].n}下 · 第 ${m} 爻动`;
        draw(ben, 'ben-bars'); draw(bian, 'bian-bars');

        const sg = baseGua[s], xg = baseGua[x];
        // 动态逻辑生成
        const content = `
            <div class="card"><h4>项目能量场</h4><p>当前处于“${sg.k}${xg.k}”平衡点。${sg.n === xg.n ? '纯粹的能量正在聚集，注意过犹不及。' : '异质能量正在碰撞，跨界合作将产生奇效。'}</p></div>
            <div class="card"><h4>避坑指南</h4><p>${m > 3 ? '外部环境（客户、上级）正发生微妙变化，请保持手机畅通，随时准备调整。' : '内部细节（代码、文档、流程）可能存在隐患，建议自检一遍。'}</p></div>
            <div class="card quote-card"><h4>鼓励师专属寄语</h4><p>“${name}”告诉我们：<b>${baseGua[s].msg}</b> 记住，职场不只是一场短跑，保持你的节奏。</p></div>
        `;
        document.getElementById('info-content').innerHTML = content;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
